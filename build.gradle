import groovy.json.JsonSlurper

plugins {
    // Loads gradle.local.properties (github.user, github.token) as project properties.
    alias(libs.plugins.infosmid.local.properties)
}

// data/projects.json drives both the docs fetch and the landing page. Read through a provider so that a
// change to the file is tracked as a configuration input and invalidates the configuration cache.
def projectsFile = layout.projectDirectory.file('data/projects.json')
def projectsData = new JsonSlurper()
        .parseText(providers.fileContents(projectsFile).asText.get())
def allProjects = projectsData.projects
def projectGroups = projectsData.groups ?: []
// projects flagged "fetch": true have a <name>-doc artefact of the given "version" on GitHub Packages
def fetchProjects = allProjects.findAll { it.fetch }

repositories {
    mavenLocal {
        content {
            includeGroupAndSubgroups('org.infosmid')
        }
    }
    fetchProjects*.name.each { repo ->
        maven {
            content {
                includeGroupAndSubgroups('org.infosmid')
            }
            name = "GitHubPackages-${repo}"
            url = uri("https://maven.pkg.github.com/infosmid-org/${repo}")
            credentials {
                username = System.getenv("GITHUB_ACTOR") ?: findProperty('github.user')
                password = System.getenv("GITHUB_TOKEN") ?: findProperty('github.token')
            }
        }
    }
}

def projectsDir = layout.projectDirectory.dir('pages/projects')

def expandTasks = fetchProjects.collect { project ->
    def name = project.name
    def version = project.version ?: { throw new GradleException("projects.json: '${name}' has fetch=true but no version") }()
    def conf = configurations.create("docs_${name.replace('-', '_')}") {
        canBeConsumed = false
        canBeResolved = true
        resolutionStrategy.cacheChangingModulesFor(0, 'seconds')
    }
    dependencies.add(conf.name, "org.infosmid:${name}-doc:${version}:docs@zip") {
        changing = true
    }
    tasks.register("docs_${name.replace('-', '_')}", Sync) {
        group = 'documentation'
        description = "Expands the ${name} docs zip into pages/projects/${name}."
        from({ zipTree(conf.singleFile) })
        into(projectsDir.dir(name))
    }
}

tasks.register('docs') {
    group = 'documentation'
    description = 'Expands the docs of every project into pages/projects/<project-name>. Run locally.'
    dependsOn(expandTasks)
    dependsOn('renderPages')
}

// ---- Landing page rendering -------------------------------------------------
// templates/index.html (Groovy SimpleTemplateEngine, built into Gradle) + data/projects.json -> pages/index.html
def escapeHtml = { Object v ->
    (v ?: '').toString()
            .replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;').replace('"', '&quot;')
}

def iconSvg = { String type ->
    switch (type) {
        case 'github':
            return '<svg class="icon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>'
        case 'api':
            return '<svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6M14 4l-4 16"/></svg>'
        case 'docs':
            return '<svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15zM20 17v5H6.5A2.5 2.5 0 0 1 4 19.5"/></svg>'
        default:
            return '<svg class="icon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3zm-9 4h6V5H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-6h-2v6H5V7z"/></svg>'
    }
}

tasks.register('renderPages', Copy) {
    group = 'documentation'
    description = 'Renders templates/index.html with data/projects.json into pages/index.html.'
    inputs.file(projectsFile)
    from(layout.projectDirectory.dir('templates')) {
        include 'index.html'
        expand([
                projects: allProjects,
                groups  : projectGroups,
                h       : escapeHtml,
                icon    : iconSvg
        ])
    }
    into(layout.projectDirectory.dir('pages'))
}

